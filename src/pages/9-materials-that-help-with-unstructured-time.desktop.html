<style id="bg-replacement-styles">
* { box-sizing: border-box; }
img { max-width: 100%; height: auto; }

.has-bg-image {
  position: relative !important;
  background-image: none !important;
  background: none !important;
  contain: layout paint;
  width: 100%;
  height: 100%;
}

.bg-replacement-img {
  position: absolute !important;

  left: 0 !important;

  width: 100%;

}
  table, thead, tbody, tr {
    width: 100%;

.has-bg-image > *:not(.bg-replacement-img) {
  position: relative;
  z-index: 1;

[data-bg-id] {

img[loading="lazy"] {
  content-visibility: auto;

:root {
    --pb-purple: #6B2D8B;
    --pb-purple-dark: #4A1D6B;
    --pb-teal: #00A5A8;
    --pb-teal-dark: #008588;
    --gradient-title: linear-gradient(135deg, #591ce6 5%, #F9598D 45%, #FB8B61 85%);
    --glass-bg: rgba(255, 255, 255, 0.7);
    --glass-border: rgba(255, 255, 255, 0.5);
    --glass-shadow: 0 8px 32px rgba(107, 45, 139, 0.15);
    --glass-blur: blur(20px);
    --text-primary: #1a1a2e;
    --text-secondary: #4a4a6a;
    --radius-sm: 12px;
    --radius-md: 16px;
    --radius-lg: 24px;
}

/* Share Block Container */
.pb-share-block {
    background: var(--glass-bg);
    backdrop-filter: var(--glass-blur);
    -webkit-backdrop-filter: var(--glass-blur);
    border: 1px solid var(--glass-border);
    border-radius: var(--radius-lg);
    padding: 24px;
    box-shadow: var(--glass-shadow);
    position: relative;
    overflow: hidden;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

.pb-share-block::before,
.pb-share-block::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.4;
    pointer-events: none;
    z-index: 0;
}

.pb-share-block::before {
    width: 200px;
    height: 200px;
    background: #591ce6;
    top: -100px;
    right: -50px;
}

.pb-share-block::after {
    width: 150px;
    height: 150px;
    background: #FB8B61;
    bottom: -80px;
    left: -30px;
}

.pb-share-block > * {
    position: relative;
    z-index: 1;
}

/* Header */
.share-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
}

.share-title-icon {
    width: 44px;
    height: 44px;
    background: var(--gradient-title);
    border-radius: var(--radius-sm);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 4px 15px rgba(89, 28, 230, 0.3);
    flex-shrink: 0;
}

.share-title-icon svg {
    width: 24px;
    height: 24px;
    fill: white;
}

.share-title-text h3 {
    font-size: 1.2rem;
    font-weight: 700;
    margin: 0;
    background: var(--gradient-title);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
}

.share-title-text span {
    font-size: 0.85rem;
    color: var(--text-secondary);
}

/* Native Share Button (Mobile) */
.native-share-wrapper {
    display: none;
    margin-bottom: 16px;
}

@media (max-width: 768px) {
    .native-share-wrapper {
        display: block;
    }
}

.native-share-btn {
    width: 100%;
    padding: 14px 24px;
    background: var(--gradient-title);
    border: none;
    border-radius: var(--radius-md);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    box-shadow: 0 8px 24px rgba(89, 28, 230, 0.3);
    transition: all 0.3s ease;
}

.native-share-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 32px rgba(89, 28, 230, 0.4);
}

.native-share-btn svg {
    width: 20px;
    height: 20px;
    fill: white;
}

/* Share Buttons Grid */
.share-buttons {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
}

@media (max-width: 600px) {
    .share-buttons {
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
    }
}

@media (max-width: 400px) {
    .share-buttons {
        grid-template-columns: repeat(4, 1fr);
    }
}

/* Share Button */
.share-btn {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 14px 8px;
    background: rgba(255, 255, 255, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.8);
    border-radius: var(--radius-md);
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    text-decoration: none;
    position: relative;
     z-index: 0;
    overflow: hidden;
     color: var(--text-secondary);  
}

.share-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--btn-gradient);
     opacity: 0;
    z-index: -1;
    transition: opacity 0.3s ease;
}

.share-btn:hover::before {
    opacity: 1;
}

.share-btn:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 24px var(--btn-shadow);
    border-color: transparent;
      color: #ffffff;
}

.share-btn:hover .btn-icon {
    transform: scale(1.1);
}
    .btn-icon,
.btn-label {
    position: relative;
    z-index: 1;
}

.share-btn:hover .btn-icon svg {
    fill: white;
}

.share-btn:hover .btn-label {
   color: #ffffff;
}

.share-btn:active {
    transform: translateY(-2px);
}

.btn-icon {
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
    transition: transform 0.3s ease;
}

.btn-icon svg {
    width: 24px;
    height: 24px;
    fill: var(--btn-color);
    transition: fill 0.3s ease;
}

.btn-label {
    font-size: 0.7rem;
    font-weight: 600;
    color: var(--text-secondary);
    position: relative;
    z-index: 1;
    transition: color 0.3s ease;
    text-align: center;
}

/* Platform Colors */
.share-btn.whatsapp {
    --btn-color: #25D366;
    --btn-gradient: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
    --btn-shadow: rgba(37, 211, 102, 0.3);
}

.share-btn.facebook {
    --btn-color: #1877F2;
    --btn-gradient: linear-gradient(135deg, #1877F2 0%, #0D5ABD 100%);
    --btn-shadow: rgba(24, 119, 242, 0.3);
}

.share-btn.twitter {
    --btn-color: #000000;
    --btn-gradient: linear-gradient(135deg, #14171A 0%, #000000 100%);
    --btn-shadow: rgba(0, 0, 0, 0.3);
}

.share-btn.linkedin {
    --btn-color: #0A66C2;
    --btn-gradient: linear-gradient(135deg, #0A66C2 0%, #004182 100%);
    --btn-shadow: rgba(10, 102, 194, 0.3);
}

.share-btn.telegram {
    --btn-color: #26A5E4;
    --btn-gradient: linear-gradient(135deg, #26A5E4 0%, #0088CC 100%);
    --btn-shadow: rgba(38, 165, 228, 0.3);
}

.share-btn.pinterest {
    --btn-color: #E60023;
    --btn-gradient: linear-gradient(135deg, #E60023 0%, #AD001A 100%);
    --btn-shadow: rgba(230, 0, 35, 0.3);
}

.share-btn.instagram {
    --btn-color: #E4405F;
    --btn-gradient: linear-gradient(135deg, #833AB4 0%, #E4405F 50%, #FCAF45 100%);
    --btn-shadow: rgba(228, 64, 95, 0.3);
}

.share-btn.email {
    --btn-color: #591ce6;
    --btn-gradient: linear-gradient(135deg, #591ce6 0%, #F9598D 100%);
    --btn-shadow: rgba(89, 28, 230, 0.3);
}

.share-btn.copy-link {
    --btn-color: #FB8B61;
    --btn-gradient: linear-gradient(135deg, #F9598D 0%, #FB8B61 100%);
    --btn-shadow: rgba(251, 139, 97, 0.3);
}

.share-btn.print {
    --btn-color: #6B7280;
    --btn-gradient: linear-gradient(135deg, #6B7280 0%, #4B5563 100%);
    --btn-shadow: rgba(107, 114, 128, 0.3);
}

/* Copy Success State */
.share-btn.copy-link.copied::before {
    opacity: 1;
}

.share-btn.copy-link.copied .btn-icon svg {
    fill: white;
}

.share-btn.copy-link.copied .btn-label {
    color: white;
}

/* Toast Notification */
.pb-toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--gradient-title);
    color: white;
    padding: 14px 28px;
    border-radius: 50px;
    font-size: 0.9rem;
    font-weight: 600;
    box-shadow: 0 8px 32px rgba(89, 28, 230, 0.4);
    opacity: 0;
    visibility: hidden;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 10px;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

.pb-toast.show {
    transform: translateX(-50%) translateY(0);
    opacity: 1;
    visibility: visible;
}

.share-btn > * {
    position: relative;
    z-index: 1;
}

.pb-toast svg {
    width: 20px;
    height: 20px;
    fill: white;
}

/* Responsive */
@media (max-width: 600px) {
    .pb-share-block {
        padding: 20px 16px;
    }
    
    .share-btn {
        padding: 12px 6px;
    }
    
    .btn-icon svg {
        width: 22px;
        height: 22px;
    }
    
    .btn-label {
        font-size: 0.65rem;
    }
}

/* Print */
@media print {
    .pb-share-block {
        display: none !important;
    }
}
